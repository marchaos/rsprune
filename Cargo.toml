[package]
name = "rsprune"
version = "0.1.0"
edition = "2024"

[lib]
name = "rsprune"
path = "src/lib.rs"

[[bin]]
name = "rsprune"
path = "src/main.rs"

[dependencies]
oxc_allocator = "0.116.0"
oxc_parser = "0.116.0"
oxc_ast = "0.116.0"
oxc_span = "0.116.0"
oxc_resolver = "11.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
jsonc-parser = { version = "0.29.0", features = ["serde"] }
walkdir = "2.5.0"
anyhow = "1.0.102"
regex = "1.12.3"
oxc_ast_visit = "0.116.0"
dashmap = "6.1.0"
ignore = "0.4.25"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3"
