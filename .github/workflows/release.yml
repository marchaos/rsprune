name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  id-token: write  # for npm provenance

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm_pkg: rsprune-darwin-arm64
            bin: rsprune

          - target: x86_64-apple-darwin
            os: macos-latest
            npm_pkg: rsprune-darwin-x64
            bin: rsprune

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            npm_pkg: rsprune-linux-x64
            bin: rsprune

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            npm_pkg: rsprune-linux-arm64
            bin: rsprune
            cross: true

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm_pkg: rsprune-win32-x64
            bin: rsprune.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (ARM Linux)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C strip=symbols"

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C strip=symbols"

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place binaries into npm packages and set versions
        shell: bash
        run: |
          for pkg in rsprune-darwin-arm64 rsprune-darwin-x64 rsprune-linux-x64 rsprune-linux-arm64 rsprune-win32-x64; do
            mkdir -p npm/$pkg/bin
            cp artifacts/$pkg/* npm/$pkg/bin/
            chmod +x npm/$pkg/bin/* 2>/dev/null || true
            # Update version in package.json
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('npm/$pkg/package.json', 'utf8'));
              p.version = process.env.VERSION;
              fs.writeFileSync('npm/$pkg/package.json', JSON.stringify(p, null, 2) + '\n');
            "
          done
          # Update main package version + optionalDependencies
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('npm/rsprune/package.json', 'utf8'));
            p.version = process.env.VERSION;
            for (const k of Object.keys(p.optionalDependencies)) {
              p.optionalDependencies[k] = process.env.VERSION;
            }
            fs.writeFileSync('npm/rsprune/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in rsprune-darwin-arm64 rsprune-darwin-x64 rsprune-linux-x64 rsprune-linux-arm64 rsprune-win32-x64; do
            npm publish npm/$pkg --access public --provenance
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/rsprune --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: artifacts/**/*
